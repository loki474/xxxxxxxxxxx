

    <div class="container">
        <h1>2FA Bypass</h1>

        <div class="form-group">
            <label for="cookieInput">Cookie:</label>
            <input type="text" id="cookieInput" placeholder="Enter session cookie">
        </div>

        <div class="form-group">
            <label for="typeSelect">Bypass Type:</label>
            <select id="typeSelect">
                <option value="1">Type 1 - Standard Bypass</option>
                <option value="2">Type 2 - Advanced Bypass</option>
                <option value="3">Type 3 - Emergency Override</option>
            </select>
        </div>

        <button id="bypassButton">Execute Bypass</button>

        <div id="resultDiv">Results will be displayed here...</div>
    </div>
